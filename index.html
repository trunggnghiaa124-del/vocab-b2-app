<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocabMaster B2 - Học Từ Vựng & Collocations</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f8fafc; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const initialVocabList = [
      { id: '1', word: 'pursue a career', meaning: 'theo đuổi sự nghiệp', example: 'She decided to pursue a career in international relations.', status: 'new', folder: 'Career' },
      { id: '2', word: 'climb the corporate ladder', meaning: 'thăng tiến trong công việc', example: 'He worked round the clock to climb the corporate ladder.', status: 'new', folder: 'Career' },
      { id: '3', word: 'work-life balance', meaning: 'cân bằng công việc & cuộc sống', example: 'Achieving a healthy work-life balance reduces burnouts.', status: 'new', folder: 'Career' },
      { id: '4', word: 'gain practical experience', meaning: 'tích lũy kinh nghiệm thực tế', example: 'Internships allow students to gain practical experience.', status: 'new', folder: 'Career' },
      { id: '5', word: 'meet tight deadlines', meaning: 'hoàn thành công việc đúng hạn chót', example: 'Our team often has to meet extremely tight deadlines.', status: 'new', folder: 'Career' },
      { id: '6', word: 'hone one\'s skills', meaning: 'rèn luyện / trau dồi kỹ năng', example: 'This training course helps professionals hone their leadership skills.', status: 'new', folder: 'Career' },
      { id: '7', word: 'prospect of promotion', meaning: 'triển vọng được thăng chức', example: 'Good performance increases your prospect of promotion.', status: 'new', folder: 'Career' },
      { id: '8', word: 'take the initiative', meaning: 'chủ động trong công việc', example: 'Managers appreciate employees who take the initiative.', status: 'new', folder: 'Career' },
    ];

    const initialFolders = ['Tất cả', 'Career', 'Hàng ngày', 'IELTS Academic'];

    function App() {
      const [vocabList, setVocabList] = useState(() => {
        const saved = localStorage.getItem('vocab_master_b2_list');
        return saved ? JSON.parse(saved) : initialVocabList;
      });
      const [folders, setFolders] = useState(() => {
        const saved = localStorage.getItem('vocab_master_b2_folders');
        return saved ? JSON.parse(saved) : initialFolders;
      });

      const [selectedFolder, setSelectedFolder] = useState('Career');
      const [activeTab, setActiveTab] = useState('flashcard');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [animMode, setAnimMode] = useState('fade');
      const [isFadingOut, setIsFadingOut] = useState(false);

      const [newWord, setNewWord] = useState('');
      const [newMeaning, setNewMeaning] = useState('');
      const [newExample, setNewExample] = useState('');
      const [newFolderInput, setNewFolderInput] = useState('');
      const [targetFolderForAdd, setTargetFolderForAdd] = useState('Career');
      const [bulkText, setBulkText] = useState('');
      const [searchTerm, setSearchTerm] = useState('');

      const [gameMode, setGameMode] = useState('mc');
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [spellingInput, setSpellingInput] = useState('');

      useEffect(() => { localStorage.setItem('vocab_master_b2_list', JSON.stringify(vocabList)); }, [vocabList]);
      useEffect(() => { localStorage.setItem('vocab_master_b2_folders', JSON.stringify(folders)); }, [folders]);

      const filteredVocab = useMemo(() => {
        return vocabList.filter(item => {
          const matchFolder = selectedFolder === 'Tất cả' || item.folder === selectedFolder;
          const matchSearch = item.word.toLowerCase().includes(searchTerm.toLowerCase()) || item.meaning.toLowerCase().includes(searchTerm.toLowerCase());
          return matchFolder && matchSearch;
        });
      }, [vocabList, selectedFolder, searchTerm]);

      useEffect(() => { setCurrentIndex(0); setIsFlipped(false); }, [selectedFolder]);

      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }
      };

      const markStatusAndNext = (status) => {
        if (filteredVocab.length === 0) return;
        const currentItem = filteredVocab[currentIndex];
        setVocabList(prev => prev.map(item => item.id === currentItem.id ? { ...item, status } : item));

        setIsFadingOut(true);
        setTimeout(() => {
          setIsFlipped(false);
          setCurrentIndex(prev => (prev < filteredVocab.length - 1 ? prev + 1 : 0));
          setIsFadingOut(false);
        }, 200);
      };

      const handleAddWord = (e) => {
        e.preventDefault();
        if (!newWord.trim() || !newMeaning.trim()) return;
        const newItem = { id: Date.now().toString(), word: newWord.trim(), meaning: newMeaning.trim(), example: newExample.trim(), status: 'new', folder: targetFolderForAdd };
        setVocabList([newItem, ...vocabList]);
        setNewWord(''); setNewMeaning(''); setNewExample('');
        alert('Đã thêm từ mới thành công!');
      };

      const handleBulkImport = () => {
        if (!bulkText.trim()) return;
        const lines = bulkText.split('\n');
        const newItems = [];
        lines.forEach(line => {
          const parts = line.split('-').map(p => p.trim());
          if (parts[0] && parts[1]) {
            newItems.push({ id: Math.random().toString(36).substr(2, 9), word: parts[0], meaning: parts[1], example: parts[2] || '', status: 'new', folder: targetFolderForAdd });
          }
        });
        if (newItems.length > 0) {
          setVocabList([...newItems, ...vocabList]);
          setBulkText('');
          alert(`Đã thêm ${newItems.length} từ vào thư mục "${targetFolderForAdd}"!`);
        }
      };

      const handleAddFolder = () => {
        if (!newFolderInput.trim()) return;
        if (!folders.includes(newFolderInput.trim())) {
          setFolders([...folders, newFolderInput.trim()]);
          setSelectedFolder(newFolderInput.trim());
          setTargetFolderForAdd(newFolderInput.trim());
        }
        setNewFolderInput('');
      };

      const masteredCount = filteredVocab.filter(i => i.status === 'mastered').length;
      const reviewCount = filteredVocab.filter(i => i.status === 'review').length;
      const percentMastered = filteredVocab.length ? Math.round((masteredCount / filteredVocab.length) * 100) : 0;

      return (
        <div className="max-w-6xl mx-auto px-4 py-6 flex flex-col min-h-screen">
          {/* HEADER */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-800">
            <div className="flex items-center gap-3.5">
              <div className="relative w-13 h-13 rounded-2xl bg-gradient-to-tr from-amber-400 via-indigo-600 to-purple-600 p-[2px] shadow-lg shadow-indigo-500/25">
                <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center flex-col px-3 py-1">
                  <span className="text-[10px] font-black tracking-widest text-amber-400 leading-none">PRO</span>
                  <span className="text-xl font-black text-white leading-none">B2</span>
                </div>
              </div>
              <div>
                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                  VocabMaster <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-extrabold border border-indigo-500/20">V2.0</span>
                </h1>
                <p className="text-xs text-slate-400">Hệ thống ôn tập từ vựng & Collocations B2</p>
              </div>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto max-w-full pb-2 md:pb-0">
              <span className="text-xs font-semibold text-slate-400 whitespace-nowrap">Chủ đề:</span>
              {folders.map(f => (
                <button
                  key={f}
                  onClick={() => setSelectedFolder(f)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                    selectedFolder === f
                      ? 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md shadow-indigo-500/25'
                      : 'bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800'
                  }`}
                >
                  {f} {f !== 'Tất cả' && `(${vocabList.filter(i => i.folder === f).length})`}
                </button>
              ))}
            </div>
          </header>

          {/* MAIN NAV */}
          <nav className="flex items-center justify-center my-6">
            <div className="bg-slate-900/90 backdrop-blur-md p-1.5 rounded-2xl border border-slate-800 flex gap-1 shadow-inner">
              <button onClick={() => setActiveTab('flashcard')} className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${activeTab === 'flashcard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>🎴 Flashcard</button>
              <button onClick={() => setActiveTab('games')} className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${activeTab === 'games' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>🎮 Mini Game</button>
              <button onClick={() => setActiveTab('add')} className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${activeTab === 'add' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>⚙️ Quản Lý & Thêm Từ ({filteredVocab.length})</button>
              <button onClick={() => setActiveTab('stats')} className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${activeTab === 'stats' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>📊 Thống Kê</button>
            </div>
          </nav>

          {/* TAB 1: FLASHCARD */}
          {activeTab === 'flashcard' && (
            <div className="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full">
              <div className="w-full flex items-center justify-between mb-4 px-2">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full">
                    Mục: {selectedFolder} ({currentIndex + 1}/{filteredVocab.length || 1})
                  </span>
                  <span className="text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                    Thuộc: {masteredCount} ({percentMastered}%)
                  </span>
                </div>
                <button onClick={() => setAnimMode(animMode === 'fade' ? 'flip' : 'fade')} className="text-xs font-semibold text-slate-400 hover:text-white bg-slate-900 border border-slate-800 px-3 py-1 rounded-full">
                  Chế độ: <strong className="text-indigo-400">{animMode === 'fade' ? 'Êm mắt (Fade)' : 'Xoay 3D'}</strong>
                </button>
              </div>

              {filteredVocab.length === 0 ? (
                <div className="w-full h-80 bg-slate-900/50 border-2 border-dashed border-slate-800 rounded-3xl flex flex-col items-center justify-center text-center p-6">
                  <span className="text-5xl mb-4">📭</span>
                  <h3 className="text-xl font-bold text-white mb-2">Chưa có từ vựng nào trong thư mục này</h3>
                  <button onClick={() => setActiveTab('add')} className="mt-4 px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-600/30">+ Thêm từ ngay</button>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">
                  <div onClick={() => setIsFlipped(!isFlipped)} className={`w-full min-h-[460px] cursor-pointer relative select-none transition-all duration-300 ${isFadingOut ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}>
                    <div className="w-full h-full min-h-[460px] rounded-3xl p-8 md:p-12 flex flex-col items-center justify-between text-center border-2 border-indigo-500/30 bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950/40 shadow-2xl relative overflow-hidden group">
                      <div className="w-full flex items-center justify-between text-slate-400 text-xs font-bold tracking-wider uppercase">
                        <span>{isFlipped ? 'MẶT SAU: NGHĨA & VÍ DỤ' : 'MẶT TRƯỚC: TỪ VỰNG B2'}</span>
                        <span className="text-indigo-400 bg-indigo-900/40 px-3 py-1 rounded-full border border-indigo-700/50">Chạm để lật 🔄</span>
                      </div>
                      {!isFlipped ? (
                        <div className="my-auto flex flex-col items-center py-6">
                          <h2 className="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200 mb-6">{filteredVocab[currentIndex]?.word}</h2>
                          <button onClick={(e) => { e.stopPropagation(); speak(filteredVocab[currentIndex]?.word); }} className="px-6 py-3 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 font-bold hover:bg-indigo-600 hover:text-white transition-all flex items-center gap-3 text-lg">🔊 Phát âm</button>
                        </div>
                      ) : (
                        <div className="my-auto flex flex-col items-center py-6">
                          <span className="text-xs font-bold text-amber-400 uppercase tracking-widest mb-2">Nghĩa tiếng Việt</span>
                          <h3 className="text-3xl md:text-5xl font-black text-amber-300 mb-6">{filteredVocab[currentIndex]?.meaning}</h3>
                          {filteredVocab[currentIndex]?.example && <div className="bg-slate-950/60 border border-slate-800 p-5 rounded-2xl text-slate-300 text-base md:text-lg italic">"{filteredVocab[currentIndex]?.example}"</div>}
                        </div>
                      )}
                      <div className="w-full flex items-center justify-between text-xs text-slate-400 font-semibold pt-4 border-t border-slate-800">
                        <span>Chủ đề: <strong className="text-slate-200">{filteredVocab[currentIndex]?.folder}</strong></span>
                        <span>Trạng thái: <strong className={filteredVocab[currentIndex]?.status === 'mastered' ? 'text-emerald-400' : 'text-amber-400'}>{filteredVocab[currentIndex]?.status === 'mastered' ? 'Đã thuộc ✨' : 'Chưa thuộc 🔄'}</strong></span>
                      </div>
                    </div>
                  </div>

                  <div className="w-full flex items-center justify-between gap-4 mt-6">
                    <button onClick={() => markStatusAndNext('review')} className="flex-1 py-4 px-6 rounded-2xl bg-slate-900 border-2 border-amber-500/40 text-amber-400 font-black text-lg hover:bg-amber-500/10 transition-all">🔄 Cần ôn lại</button>
                    <button onClick={() => markStatusAndNext('mastered')} className="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-black text-lg shadow-lg hover:from-emerald-400 hover:to-teal-500 transition-all">✨ Đã thuộc từ này</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 2: MINI GAMES */}
          {activeTab === 'games' && (
            <div className="flex-1 max-w-3xl mx-auto w-full">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-xl">
                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <button onClick={() => setGameMode('mc')} className={`px-4 py-2 rounded-xl text-xs font-bold ${gameMode === 'mc' ? 'bg-indigo-600 text-white' : 'bg-slate-950 text-slate-400'}`}>Trắc nghiệm</button>
                    <button onClick={() => setGameMode('spelling')} className={`px-4 py-2 rounded-xl text-xs font-bold ${gameMode === 'spelling' ? 'bg-indigo-600 text-white' : 'bg-slate-950 text-slate-400'}`}>Gõ chính tả</button>
                  </div>
                  <div className="flex items-center gap-4">
                    <span className="text-sm font-bold text-amber-400">🔥 Chuỗi: {streak}</span>
                    <span className="text-sm font-bold text-emerald-400">⭐ Điểm: {score}</span>
                  </div>
                </div>

                {gameMode === 'mc' ? (
                  <div className="text-center py-6">
                    <span className="text-xs font-bold text-indigo-400 uppercase">Chọn nghĩa chính xác:</span>
                    <h3 className="text-4xl font-black text-white my-4">{filteredVocab[currentIndex]?.word}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                      {filteredVocab.slice(0, 4).map((item, idx) => (
                        <button key={idx} onClick={() => {
                          if (item.id === filteredVocab[currentIndex]?.id) {
                            setScore(score + 10); setStreak(streak + 1);
                            alert('🎉 Đúng rồi! +10 điểm'); setCurrentIndex((currentIndex + 1) % filteredVocab.length);
                          } else { setStreak(0); alert('❌ Thử lại nhé!'); }
                        }} className="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-slate-200 font-bold text-left hover:border-indigo-500 transition-all">
                          {String.fromCharCode(65 + idx)}. {item.meaning}
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="text-center py-6 space-y-4">
                    <span className="text-xs font-bold text-indigo-400 uppercase">Nghe & xem giải nghĩa để gõ đúng từ:</span>
                    <h3 className="text-3xl font-black text-amber-300 my-2">{filteredVocab[currentIndex]?.meaning}</h3>
                    <button onClick={() => speak(filteredVocab[currentIndex]?.word)} className="px-4 py-2 bg-indigo-600/20 text-indigo-300 rounded-xl font-bold text-xs">🔊 Nghe lại phát âm</button>
                    <div className="flex justify-center my-4">
                      <input type="text" placeholder="Gõ lại từ tiếng Anh..." value={spellingInput} onChange={(e) => setSpellingInput(e.target.value)} className="w-full max-w-md bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-white text-lg font-bold" />
                    </div>
                    <div>
                      <button onClick={() => {
                        if (spellingInput.trim().toLowerCase() === filteredVocab[currentIndex]?.word.toLowerCase()) {
                          setScore(score + 15); setStreak(streak + 1); alert('🎉 Chính xác tuyệt đối! +15 điểm'); setSpellingInput(''); setCurrentIndex((currentIndex + 1) % filteredVocab.length);
                        } else { alert('❌ Chưa chính xác, kiểm tra lại nhé!'); }
                      }} className="px-8 py-3 bg-emerald-600 text-slate-950 font-black rounded-xl">Kiểm tra kết quả</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 3: QUẢN LÝ & THÊM TỪ (GỘP DANH SÁCH VÀO ĐÂY) */}
          {activeTab === 'add' && (
            <div className="flex-1 max-w-4xl mx-auto w-full space-y-8">
              {/* Form Thêm Từ Thủ Công */}
              <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 className="text-base font-bold text-white">✍️ Thêm từ thủ công vào mục "{targetFolderForAdd}"</h3>
                <form onSubmit={handleAddWord} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" required placeholder="Từ tiếng Anh *" value={newWord} onChange={(e) => setNewWord(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                    <input type="text" required placeholder="Nghĩa tiếng Việt *" value={newMeaning} onChange={(e) => setNewMeaning(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                  </div>
                  <input type="text" placeholder="Ví dụ câu..." value={newExample} onChange={(e) => setNewExample(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                  <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl transition-all">+ Thêm 1 từ</button>
                </form>
              </div>

              {/* Form Dán Hàng Loạt */}
              <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 className="text-base font-bold text-white">📋 Dán danh sách hàng loạt (Bulk Add)</h3>
                <textarea rows="4" placeholder={`climb the corporate ladder - thăng tiến công việc - He worked hard.\nwork-life balance - cân bằng cuộc sống - Maintaining balance is crucial.`} value={bulkText} onChange={(e) => setBulkText(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-white font-mono leading-relaxed"></textarea>
                <button onClick={handleBulkImport} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-sm rounded-xl transition-all">⚡ Nhập tất cả danh sách trên</button>
              </div>

              {/* DANH SÁCH TỪ VỰNG HIỆN TẠI */}
              <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                <div className="flex flex-col md:flex-row items-center justify-between gap-4 pb-4 border-b border-slate-800">
                  <h3 className="text-base font-bold text-white">📚 Danh sách từ vựng hiện tại ({filteredVocab.length})</h3>
                  <input type="text" placeholder="Tìm kiếm từ hoặc nghĩa..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-64 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                </div>

                <div className="grid grid-cols-1 gap-3">
                  {filteredVocab.map((item) => (
                    <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-start justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-3">
                          <h4 className="text-lg font-bold text-white">{item.word}</h4>
                          <button onClick={() => speak(item.word)} className="text-xs text-slate-400 hover:text-indigo-400">🔊</button>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400">{item.folder}</span>
                        </div>
                        <p className="text-sm font-medium text-amber-300 mt-1">{item.meaning}</p>
                        {item.example && <p className="text-xs italic text-slate-500 mt-0.5">"{item.example}"</p>}
                      </div>
                      <button onClick={() => setVocabList(vocabList.filter(i => i.id !== item.id))} className="text-xs text-rose-400 hover:text-rose-300 p-2">🗑️ Xóa</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: THỐNG KÊ (MỚI BỔ SUNG) */}
          {activeTab === 'stats' && (
            <div className="flex-1 max-w-4xl mx-auto w-full space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-2">
                  <span className="text-4xl">📚</span>
                  <div className="text-3xl font-black text-white">{vocabList.length}</div>
                  <div className="text-xs text-slate-400 font-semibold">Tổng số từ vựng trong app</div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-2">
                  <span className="text-4xl">✨</span>
                  <div className="text-3xl font-black text-emerald-400">{masteredCount}</div>
                  <div className="text-xs text-slate-400 font-semibold">Từ đã hoàn toàn ghi nhớ</div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-2">
                  <span className="text-4xl">🏆</span>
                  <div className="text-3xl font-black text-amber-400">{percentMastered}%</div>
                  <div className="text-xs text-slate-400 font-semibold">Tỷ lệ hoàn thành ({selectedFolder})</div>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                <h3 className="text-base font-bold text-white">📊 Tiến độ ghi nhớ bộ từ "{selectedFolder}"</h3>
                <div className="w-full bg-slate-950 h-4 rounded-full overflow-hidden flex p-1 border border-slate-800">
                  <div style={{ width: `${percentMastered}%` }} className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all"></div>
                </div>
                <div className="flex justify-between text-xs font-semibold text-slate-400">
                  <span>0% (Bắt đầu)</span>
                  <span>{percentMastered}% (Hiện tại)</span>
                  <span>100% (Thành thạo)</span>
                </div>
              </div>
            </div>
          )}

          <footer className="mt-auto pt-8 pb-4 text-center text-xs text-slate-500 border-t border-slate-800/60">
            VocabMaster B2 App • Học từ vựng thông minh
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
