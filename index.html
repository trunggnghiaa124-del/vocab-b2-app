<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VocabMaster Web - Hệ thống ôn tập từ vựng</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    .star-glow {
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(99, 102, 241, 0.3);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSy_YOUR_API_KEY",
      authDomain: "vocab-b2-app.firebaseapp.com",
      projectId: "vocab-b2-app",
      storageBucket: "vocab-b2-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      try { firebase.initializeApp(firebaseConfig); } catch (e) {}
    }

    // CẤU HÌNH LƯU PHIÊN ĐĂNG NHẬP VĨNH VIỄN TRÊN BỘ NHỚ TRÌNH DUYỆT
    if (firebase.auth) {
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
    }

    // TẠO ÂM THANH HIỆU ỨNG ĐÚNG / SAI BẰNG WEB AUDIO API
    const playSoundEffect = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'correct') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'triangle';

          osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1);
          osc1.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);

          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 0.3);
          osc2.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.25);

          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    };

    const initialVocabList = [
      { id: '1', word: 'pursue a career', meaning: 'theo đuổi sự nghiệp', example: 'She decided to pursue a career in international relations.', status: 'new', folder: 'Career' },
      { id: '2', word: 'climb the corporate ladder', meaning: 'thăng tiến trong công việc', example: 'He worked round the clock to climb the corporate ladder.', status: 'new', folder: 'Career' },
      { id: '3', word: 'work-life balance', meaning: 'cân bằng công việc & cuộc sống', example: 'Achieving a healthy work-life balance reduces burnouts.', status: 'new', folder: 'Career' },
      { id: '4', word: 'gain practical experience', meaning: 'tích lũy kinh nghiệm thực tế', example: 'Internships allow students to gain practical experience.', status: 'new', folder: 'Career' },
      { id: '5', word: 'meet tight deadlines', meaning: 'hoàn thành công việc đúng hạn chót', example: 'Our team often has to meet extremely tight deadlines.', status: 'new', folder: 'Career' },
      { id: '6', word: 'hone one\'s skills', meaning: 'rèn luyện / trau dồi kỹ năng', example: 'This training course helps professionals hone their leadership skills.', status: 'new', folder: 'Career' },
      { id: '7', word: 'prospect of promotion', meaning: 'triển vọng được thăng chức', example: 'Good performance increases your prospect of promotion.', status: 'new', folder: 'Career' },
      { id: '8', word: 'take the initiative', meaning: 'chủ động trong công việc', example: 'Managers appreciate employees who take the initiative.', status: 'new', folder: 'Career' },
      { id: '9', word: 'make a living', meaning: 'kiếm sống', example: 'It is tough to make a living as an artist.', status: 'new', folder: 'Hàng ngày' },
      { id: '10', word: 'keep in touch', meaning: 'giữ liên lạc', example: 'Let us keep in touch after graduation.', status: 'new', folder: 'Hàng ngày' },
      { id: '11', word: 'conduct research', meaning: 'tiến hành nghiên cứu', example: 'Scientists conduct research to find new cures.', status: 'new', folder: 'IELTS Academic' },
      { id: '12', word: 'play a vital role', meaning: 'đóng vai trò quan trọng', example: 'Education plays a vital role in nation building.', status: 'new', folder: 'IELTS Academic' }
    ];

    const initialFolders = ['Tất cả', 'Career', 'Hàng ngày', 'IELTS Academic'];

    function App() {
      const [user, setUser] = useState(() => {
        const localUser = localStorage.getItem('vocab_master_user');
        return localUser ? JSON.parse(localUser) : null;
      });
      const [authLoading, setAuthLoading] = useState(true);

      const [vocabList, setVocabList] = useState(() => {
        const saved = localStorage.getItem('vocab_master_b2_list');
        return saved ? JSON.parse(saved) : initialVocabList;
      });
      const [folders, setFolders] = useState(() => {
        const saved = localStorage.getItem('vocab_master_b2_folders');
        return saved ? JSON.parse(saved) : initialFolders;
      });

      const [selectedFolder, setSelectedFolder] = useState('Career');
      const [activeTab, setActiveTab] = useState('flashcard');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [isFadingOut, setIsFadingOut] = useState(false);

      const [newWord, setNewWord] = useState('');
      const [newMeaning, setNewMeaning] = useState('');
      const [newExample, setNewExample] = useState('');
      const [newFolderInput, setNewFolderInput] = useState('');
      const [targetFolderForAdd, setTargetFolderForAdd] = useState('Career');
      const [bulkText, setBulkText] = useState('');
      const [searchTerm, setSearchTerm] = useState('');

      // GAME STATES
      const [activeGame, setActiveGame] = useState('menu');
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [spellingInput, setSpellingInput] = useState('');
      const [scrambleInput, setScrambleInput] = useState('');

      const [tfMeaning, setTfMeaning] = useState('');
      const [tfIsCorrect, setTfIsCorrect] = useState(true);

      const [matchSelected, setMatchSelected] = useState(null);
      const [matchedIds, setMatchedIds] = useState([]);

      // GIỮ TRẠNG THÁI ĐĂNG NHẬP KHI RELOAD
      useEffect(() => {
        if (firebase.auth) {
          const unsubscribe = firebase.auth().onAuthStateChanged((currentUser) => {
            if (currentUser) {
              const userData = {
                displayName: currentUser.displayName || 'Trung Nghĩa',
                email: currentUser.email
              };
              setUser(userData);
              localStorage.setItem('vocab_master_user', JSON.stringify(userData));
            } else {
              // Chỉ xóa nếu chưa từng lưu user mock
              const savedUser = localStorage.getItem('vocab_master_user');
              if (!savedUser) setUser(null);
            }
            setAuthLoading(false);
          });
          return () => unsubscribe();
        } else {
          setAuthLoading(false);
        }
      }, []);

      const toggleFlipCard = () => {
        setIsFadingOut(true);
        setTimeout(() => {
          setIsFlipped(prev => !prev);
          setIsFadingOut(false);
        }, 150);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === 'Space' && activeTab === 'flashcard') {
            const tag = e.target.tagName.toLowerCase();
            if (tag !== 'input' && tag !== 'textarea') {
              e.preventDefault();
              toggleFlipCard();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeTab]);

      const handleGoogleLogin = () => {
        if (!firebase.auth) return;
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider)
          .then((result) => {
            const userData = {
              displayName: result.user.displayName || 'Trung Nghĩa',
              email: result.user.email
            };
            setUser(userData);
            localStorage.setItem('vocab_master_user', JSON.stringify(userData));
          })
          .catch(() => {
            const fallbackUser = { displayName: 'Trung Nghĩa', email: 'user@example.com' };
            setUser(fallbackUser);
            localStorage.setItem('vocab_master_user', JSON.stringify(fallbackUser));
          });
      };

      const handleLogout = () => {
        if (firebase.auth) firebase.auth().signOut();
        setUser(null);
        localStorage.removeItem('vocab_master_user');
      };

      useEffect(() => { localStorage.setItem('vocab_master_b2_list', JSON.stringify(vocabList)); }, [vocabList]);
      useEffect(() => { localStorage.setItem('vocab_master_b2_folders', JSON.stringify(folders)); }, [folders]);

      const filteredVocab = useMemo(() => {
        return vocabList.filter(item => {
          const matchFolder = selectedFolder === 'Tất cả' || item.folder === selectedFolder;
          const matchSearch = item.word.toLowerCase().includes(searchTerm.toLowerCase()) || item.meaning.toLowerCase().includes(searchTerm.toLowerCase());
          return matchFolder && matchSearch;
        });
      }, [vocabList, selectedFolder, searchTerm]);

      useEffect(() => { 
        setCurrentIndex(0); 
        setIsFlipped(false);
        setMatchedIds([]);
        setMatchSelected(null);
        setSelectedOption(null);
      }, [selectedFolder, activeGame]);

      useEffect(() => {
        if (filteredVocab.length > 0 && activeGame === 'tf') {
          const isCorrect = Math.random() > 0.5;
          setTfIsCorrect(isCorrect);
          if (isCorrect) {
            setTfMeaning(filteredVocab[currentIndex]?.meaning);
          } else {
            const randomOther = filteredVocab[(currentIndex + 1) % filteredVocab.length];
            setTfMeaning(randomOther?.meaning || filteredVocab[currentIndex]?.meaning);
          }
        }
      }, [currentIndex, activeGame, filteredVocab]);

      const currentDynamicOptions = useMemo(() => {
        if (!filteredVocab.length || !filteredVocab[currentIndex]) return [];
        const currentItem = filteredVocab[currentIndex];
        const otherItems = filteredVocab.filter(item => item.id !== currentItem.id);
        const shuffledOthers = [...otherItems].sort(() => Math.random() - 0.5);
        const selectedOptions = [currentItem, ...shuffledOthers.slice(0, 3)];
        return selectedOptions.sort(() => Math.random() - 0.5);
      }, [currentIndex, filteredVocab, activeGame]);

      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-GB';
          utterance.rate = 0.88;

          const voices = window.speechSynthesis.getVoices();
          const ukVoice = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('British'));
          if (ukVoice) utterance.voice = ukVoice;

          window.speechSynthesis.speak(utterance);
        }
      };

      const markStatusAndNext = (status) => {
        if (filteredVocab.length === 0) return;
        const currentItem = filteredVocab[currentIndex];
        setVocabList(prev => prev.map(item => item.id === currentItem.id ? { ...item, status } : item));

        setIsFadingOut(true);
        setTimeout(() => {
          setIsFlipped(false);
          setCurrentIndex(prev => (prev < filteredVocab.length - 1 ? prev + 1 : 0));
          setIsFadingOut(false);
        }, 200);
      };

      const handleAddWord = (e) => {
        e.preventDefault();
        if (!newWord.trim() || !newMeaning.trim()) return;
        const newItem = { id: Date.now().toString(), word: newWord.trim(), meaning: newMeaning.trim(), example: newExample.trim(), status: 'new', folder: targetFolderForAdd };
        setVocabList([newItem, ...vocabList]);
        setNewWord(''); setNewMeaning(''); setNewExample('');
      };

      const handleBulkImport = () => {
        if (!bulkText.trim()) return;
        const lines = bulkText.split('\n');
        const newItems = [];
        lines.forEach(line => {
          const parts = line.split('-').map(p => p.trim());
          if (parts[0] && parts[1]) {
            newItems.push({ id: Math.random().toString(36).substr(2, 9), word: parts[0], meaning: parts[1], example: parts[2] || '', status: 'new', folder: targetFolderForAdd });
          }
        });
        if (newItems.length > 0) {
          setVocabList([...newItems, ...vocabList]);
          setBulkText('');
        }
      };

      const handleAddFolder = () => {
        if (!newFolderInput.trim()) return;
        const folderName = newFolderInput.trim();
        if (!folders.includes(folderName)) {
          setFolders([...folders, folderName]);
          setSelectedFolder(folderName);
          setTargetFolderForAdd(folderName);
        }
        setNewFolderInput('');
      };

      const handleDeleteFolder = (folderName, e) => {
        e.stopPropagation();
        if (folderName === 'Tất cả' || folderName === 'Career') return;
        if (confirm(`Bạn có chắc muốn xóa thư mục "${folderName}"?`)) {
          setFolders(folders.filter(f => f !== folderName));
          setVocabList(vocabList.filter(i => i.folder !== folderName));
          if (selectedFolder === folderName) setSelectedFolder('Tất cả');
        }
      };

      const scrambledWord = useMemo(() => {
        if (!filteredVocab[currentIndex]) return '';
        const w = filteredVocab[currentIndex].word;
        return w.split('').sort(() => Math.random() - 0.5).join('');
      }, [currentIndex, filteredVocab]);

      const masteredCount = filteredVocab.filter(i => i.status === 'mastered').length;
      const percentMastered = filteredVocab.length ? Math.round((masteredCount / filteredVocab.length) * 100) : 0;

      const handleSelectAnswer = (item, idx) => {
        if (selectedOption !== null) return;
        const isCorrect = item.id === filteredVocab[currentIndex]?.id;
        setSelectedOption({ idx, isCorrect });

        if (isCorrect) {
          playSoundEffect('correct');
          setScore(prev => prev + 10);
          setStreak(prev => prev + 1);
        } else {
          playSoundEffect('wrong');
          setStreak(0);
        }

        setTimeout(() => {
          setSelectedOption(null);
          setCurrentIndex((currentIndex + 1) % filteredVocab.length);
        }, 700);
      };

      const checkSpellingAnswer = () => {
        if (selectedOption !== null) return;
        const isCorrect = spellingInput.trim().toLowerCase() === filteredVocab[currentIndex]?.word.toLowerCase();
        setSelectedOption({ isCorrect });
        if (isCorrect) { playSoundEffect('correct'); setScore(score + 15); setStreak(streak + 1); } 
        else { playSoundEffect('wrong'); setStreak(0); }
        setTimeout(() => {
          setSelectedOption(null);
          setSpellingInput('');
          if (isCorrect) setCurrentIndex((currentIndex + 1) % filteredVocab.length);
        }, 800);
      };

      const checkScrambleAnswer = () => {
        if (selectedOption !== null) return;
        const isCorrect = scrambleInput.trim().toLowerCase() === filteredVocab[currentIndex]?.word.toLowerCase();
        setSelectedOption({ isCorrect });
        if (isCorrect) { playSoundEffect('correct'); setScore(score + 12); setStreak(streak + 1); } 
        else { playSoundEffect('wrong'); setStreak(0); }
        setTimeout(() => {
          setSelectedOption(null);
          setScrambleInput('');
          if (isCorrect) setCurrentIndex((currentIndex + 1) % filteredVocab.length);
        }, 800);
      };

      return (
        <div className="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex flex-col min-h-screen">
          
          {/* HEADER RESPONSIVE */}
          <header className="flex flex-col sm:flex-row items-center justify-between gap-3 pb-4 sm:pb-6 border-b border-slate-800">
            <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
              <div className="flex items-center gap-3">
                <div className="relative w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-gradient-to-tr from-amber-400 via-indigo-500 to-purple-600 p-[2px] star-glow flex items-center justify-center">
                  <div className="w-full h-full bg-slate-950 rounded-[10px] sm:rounded-[14px] flex items-center justify-center text-xl sm:text-2xl">
                    ⭐
                  </div>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-black tracking-tight text-white">
                    VocabMaster
                  </h1>
                  <p className="text-[11px] sm:text-xs text-slate-400 font-medium">Hệ thống ôn tập từ vựng (UK English)</p>
                </div>
              </div>
            </div>

            {/* GOOGLE AUTH WITH PERSISTENCE */}
            <div className="w-full sm:w-auto flex justify-end">
              {authLoading ? (
                <div className="px-4 py-2 bg-slate-900 text-slate-400 rounded-xl text-xs font-semibold animate-pulse">Đang kiểm tra đăng nhập...</div>
              ) : user ? (
                <div className="flex items-center gap-2 sm:gap-3 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
                  <div className="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-xs">
                    {user.displayName ? user.displayName.charAt(0) : 'U'}
                  </div>
                  <div className="text-left">
                    <div className="text-xs font-bold text-white">{user.displayName || 'Tài khoản'}</div>
                    <div className="text-[9px] text-emerald-400">Đã kết nối 🟢</div>
                  </div>
                  <button onClick={handleLogout} className="text-xs text-slate-500 hover:text-rose-400 ml-1 font-semibold">Thoát</button>
                </div>
              ) : (
                <button
                  onClick={handleGoogleLogin}
                  className="w-full sm:w-auto px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 text-slate-200 font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-md"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.3-.8-.4-1.8-.4-2.8s.1-2 .4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
                  Đăng nhập Gmail
                </button>
              )}
            </div>
          </header>

          {/* MAIN NAV TABS RESPONSIVE MOBILE */}
          <nav className="flex items-center justify-center my-4 sm:my-6 overflow-x-auto">
            <div className="bg-slate-900/90 backdrop-blur-md p-1 rounded-xl sm:rounded-2xl border border-slate-800 flex gap-1 shadow-inner max-w-full overflow-x-auto">
              <button onClick={() => setActiveTab('flashcard')} className={`px-3 sm:px-5 py-2 rounded-lg sm:rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${activeTab === 'flashcard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>🎴 Flashcard</button>
              <button onClick={() => setActiveTab('games')} className={`px-3 sm:px-5 py-2 rounded-lg sm:rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${activeTab === 'games' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>🎮 6 Games</button>
              <button onClick={() => setActiveTab('add')} className={`px-3 sm:px-5 py-2 rounded-lg sm:rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${activeTab === 'add' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>⚙️ Quản Lý ({filteredVocab.length})</button>
              <button onClick={() => setActiveTab('stats')} className={`px-3 sm:px-5 py-2 rounded-lg sm:rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${activeTab === 'stats' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}>📊 Thống Kê</button>
            </div>
          </nav>

          {/* TAB 1: FLASHCARD */}
          {activeTab === 'flashcard' && (
            <div className="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full">
              <div className="w-full flex items-center justify-between mb-3 px-1">
                <div className="flex items-center gap-2">
                  <div className="relative">
                    <select
                      value={selectedFolder}
                      onChange={(e) => setSelectedFolder(e.target.value)}
                      className="bg-indigo-950/80 border border-indigo-500/40 text-indigo-300 font-bold text-xs px-2.5 py-1.5 rounded-xl focus:outline-none cursor-pointer appearance-none pr-7"
                    >
                      {folders.map(f => (
                        <option key={f} value={f} className="bg-slate-900 text-white">

            </div>
          )}

          {/* TAB 3: QUẢN LÝ TỪ VỰNG & CHỦ ĐỀ */}
          {activeTab === 'add' && (
            <div className="flex-1 max-w-4xl mx-auto w-full space-y-6 sm:space-y-8">
              <div className="bg-slate-900 p-5 sm:p-6 rounded-3xl border border-slate-800 space-y-4">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                  <h3 className="text-sm sm:text-base font-bold text-white">✍️ Thêm từ thủ công</h3>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400 font-semibold">Lưu vào:</span>
                    <select
                      value={targetFolderForAdd}
                      onChange={(e) => setTargetFolderForAdd(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-indigo-300 font-bold text-xs px-2.5 py-1.5 rounded-xl focus:outline-none"
                    >
                      {folders.filter(f => f !== 'Tất cả').map(f => (
                        <option key={f} value={f}>{f}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <form onSubmit={handleAddWord} className="space-y-3 sm:space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" required placeholder="Từ tiếng Anh *" value={newWord} onChange={(e) => setNewWord(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-white" />
                    <input type="text" required placeholder="Nghĩa tiếng Việt *" value={newMeaning} onChange={(e) => setNewMeaning(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-white" />
                  </div>
                  <input type="text" placeholder="Ví dụ câu..." value={newExample} onChange={(e) => setNewExample(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-white" />
                  <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs sm:text-sm rounded-xl transition-all">+ Thêm từ mới</button>
                </form>
              </div>

              <div className="bg-slate-900 p-5 sm:p-6 rounded-3xl border border-slate-800 space-y-3">
                <h3 className="text-sm sm:text-base font-bold text-white">📋 Dán danh sách hàng loạt (Bulk Add)</h3>
                <textarea rows="4" placeholder={`climb the corporate ladder - thăng tiến công việc - He worked hard.\nwork-life balance - cân bằng cuộc sống - Maintaining balance is crucial.`} value={bulkText} onChange={(e) => setBulkText(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 sm:p-4 text-xs text-white font-mono leading-relaxed"></textarea>
                <button onClick={handleBulkImport} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-xs sm:text-sm rounded-xl transition-all">⚡ Nhập danh sách trên</button>
              </div>

              <div className="bg-slate-900 p-5 sm:p-6 rounded-3xl border border-slate-800 space-y-5">
                <div className="space-y-3 pb-4 border-b border-slate-800">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <h3 className="text-sm sm:text-base font-bold text-white">📁 Quản lý Chủ đề</h3>
                    <div className="flex items-center gap-2 w-full sm:w-auto">
                      <input
                        type="text"
                        placeholder="Chủ đề mới..."
                        value={newFolderInput}
                        onChange={(e) => setNewFolderInput(e.target.value)}
                        className="w-full sm:w-auto bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                      />
                      <button
                        onClick={handleAddFolder}
                        className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl whitespace-nowrap"
                      >
                        + Tạo
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <span className="text-xs text-slate-400">Xem:</span>
                    <select
                      value={selectedFolder}
                      onChange={(e) => { setSelectedFolder(e.target.value); setTargetFolderForAdd(e.target.value === 'Tất cả' ? 'Career' : e.target.value); }}
                      className="bg-slate-950 border border-slate-800 text-white font-bold text-xs px-3 py-2 rounded-xl focus:outline-none"
                    >
                      {folders.map(f => (
                        <option key={f} value={f}>
                          {f} ({vocabList.filter(i => f === 'Tất cả' || i.folder === f).length} từ)
                        </option>
                      ))}
                    </select>

                    {selectedFolder !== 'Tất cả' && selectedFolder !== 'Career' && (
                      <button
                        onClick={(e) => handleDeleteFolder(selectedFolder, e)}
                        className="px-3 py-1.5 bg-rose-500/10 border border-rose-500/30 text-rose-400 font-bold text-xs rounded-xl"
                      >
                        🗑️ Xóa
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div className="text-xs text-slate-400 w-full sm:w-auto">
                    Hiển thị <strong className="text-indigo-400">{filteredVocab.length}</strong> từ
                  </div>
                  <input type="text" placeholder="Tìm kiếm từ..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full sm:w-64 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                </div>

                <div className="grid grid-cols-1 gap-2.5">
                  {filteredVocab.length === 0 ? (
                    <div className="text-center py-6 text-slate-500 text-xs">Chưa có từ vựng nào.</div>
                  ) : (
                    filteredVocab.map((item) => (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 flex items-start justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <h4 className="text-base font-bold text-white">{item.word}</h4>
                            <button onClick={() => speak(item.word)} className="text-xs text-slate-400 hover:text-indigo-400">🔊</button>
                            <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">{item.folder}</span>
                          </div>
                          <p className="text-xs font-medium text-amber-300 mt-0.5">{item.meaning}</p>
                          {item.example && <p className="text-[11px] italic text-slate-500 mt-0.5">"{item.example}"</p>}
                        </div>
                        <button onClick={() => setVocabList(vocabList.filter(i => i.id !== item.id))} className="text-xs text-rose-400 hover:text-rose-300 p-1">🗑️</button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: THỐNG KÊ */}
          {activeTab === 'stats' && (
            <div className="flex-1 max-w-4xl mx-auto w-full space-y-4 sm:space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-1">
                  <span className="text-3xl">📚</span>
                  <div className="text-2xl sm:text-3xl font-black text-white">{vocabList.length}</div>
                  <div className="text-xs text-slate-400 font-semibold">Tổng số từ</div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-1">
                  <span className="text-3xl">✨</span>
                  <div className="text-2xl sm:text-3xl font-black text-emerald-400">{masteredCount}</div>
                  <div className="text-xs text-slate-400 font-semibold">Từ đã thuộc</div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-1">
                  <span className="text-3xl">🏆</span>
                  <div className="text-2xl sm:text-3xl font-black text-amber-400">{percentMastered}%</div>
                  <div className="text-xs text-slate-400 font-semibold">Tỷ lệ thuộc ({selectedFolder})</div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto pt-6 pb-4 text-center text-[11px] sm:text-xs text-slate-500 border-t border-slate-800/60">
            VocabMaster Web • Hệ thống ôn tập từ vựng • Developed by Trung Nghĩa
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
