
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocabMaster B2 - Học Từ Vựng & Collocations</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (Production CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    
    .perspective-1000 {
      perspective: 1000px;
    }
    
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Transition Effects */
    .fade-transition {
      transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Dữ liệu mẫu ban đầu (Career - B2 Collocations)
    const initialVocabList = [
      { id: '1', word: 'pursue a career', meaning: 'theo đuổi sự nghiệp', example: 'She decided to pursue a career in international relations.', status: 'new', folder: 'Career' },
      { id: '2', word: 'climb the corporate ladder', meaning: 'thăng tiến trong công việc', example: 'He worked round the clock to climb the corporate ladder.', status: 'new', folder: 'Career' },
      { id: '3', word: 'work-life balance', meaning: 'cân bằng công việc & cuộc sống', example: 'Achieving a healthy work-life balance reduces burnouts.', status: 'new', folder: 'Career' },
      { id: '4', word: 'gain practical experience', meaning: 'tích lũy kinh nghiệm thực tế', example: 'Internships allow students to gain practical experience.', status: 'new', folder: 'Career' },
      { id: '5', word: 'meet tight deadlines', meaning: 'hoàn thành công việc đúng hạn chót', example: 'Our team often has to meet extremely tight deadlines.', status: 'new', folder: 'Career' },
      { id: '6', word: 'hone one\'s skills', meaning: 'rèn luyện / trau dồi kỹ năng', example: 'This training course helps professionals hone their leadership skills.', status: 'new', folder: 'Career' },
      { id: '7', word: 'prospect of promotion', meaning: 'triển vọng được thăng chức', example: 'Good performance increases your prospect of promotion.', status: 'new', folder: 'Career' },
      { id: '8', word: 'take the initiative', meaning: 'chủ động trong công việc', example: 'Managers appreciate employees who take the initiative.', status: 'new', folder: 'Career' },
    ];

    const initialFolders = ['Tất cả', 'Career', 'Hàng ngày', 'IELTS Academic'];

    function App() {
      // Local Storage States
      const [vocabList, setVocabList] = useState(() => {
        const saved = localStorage.getItem('vocab_master_b2_list');
        return saved ? JSON.parse(saved) : initialVocabList;
      });

      const [folders, setFolders] = useState(() => {
        const saved = localStorage.getItem('vocab_master_b2_folders');
        return saved ? JSON.parse(saved) : initialFolders;
      });

      const [selectedFolder, setSelectedFolder] = useState('Career');
      const [activeTab, setActiveTab] = useState('flashcard'); // 'flashcard', 'games', 'list', 'add'
      
      // Flashcard States
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [animMode, setAnimMode] = useState('fade'); // 'fade' (êm mắt) hoặc 'flip' (xoay 3D)
      const [isFadingOut, setIsFadingOut] = useState(false);

      // Form States
      const [newWord, setNewWord] = useState('');
      const [newMeaning, setNewMeaning] = useState('');
      const [newExample, setNewExample] = useState('');
      const [newFolderInput, setNewFolderInput] = useState('');
      const [targetFolderForAdd, setTargetFolderForAdd] = useState('Career');
      
      // Bulk Import State
      const [bulkText, setBulkText] = useState('');

      // Search / Filter State
      const [searchTerm, setSearchTerm] = useState('');

      // Game States
      const [gameMode, setGameMode] = useState('mc'); // 'mc', 'match', 'spelling'
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('vocab_master_b2_list', JSON.stringify(vocabList));
      }, [vocabList]);

      useEffect(() => {
        localStorage.setItem('vocab_master_b2_folders', JSON.stringify(folders));
      }, [folders]);

      // Filtered Vocabulary by Folder
      const filteredVocab = useMemo(() => {
        return vocabList.filter(item => {
          const matchFolder = selectedFolder === 'Tất cả' || item.folder === selectedFolder;
          const matchSearch = item.word.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              item.meaning.toLowerCase().includes(searchTerm.toLowerCase());
          return matchFolder && matchSearch;
        });
      }, [vocabList, selectedFolder, searchTerm]);

      // Reset Current Index when folder changes
      useEffect(() => {
        setCurrentIndex(0);
        setIsFlipped(false);
      }, [selectedFolder]);

      // Speech Synthesis
      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }
      };

      // Auto Advance to Next Card
      const markStatusAndNext = (status) => {
        if (filteredVocab.length === 0) return;
        
        const currentItem = filteredVocab[currentIndex];
        
        // Update status in master list
        setVocabList(prev => prev.map(item => 
          item.id === currentItem.id ? { ...item, status } : item
        ));

        // Advance to next word with smooth transition
        setIsFadingOut(true);
        setTimeout(() => {
          setIsFlipped(false);
          if (currentIndex < filteredVocab.length - 1) {
            setCurrentIndex(prev => prev + 1);
          } else {
            setCurrentIndex(0);
          }
          setIsFadingOut(false);
        }, 200);
      };

      // Add New Single Word
      const handleAddWord = (e) => {
        e.preventDefault();
        if (!newWord.trim() || !newMeaning.trim()) return;

        const newItem = {
          id: Date.now().toString(),
          word: newWord.trim(),
          meaning: newMeaning.trim(),
          example: newExample.trim(),
          status: 'new',
          folder: targetFolderForAdd
        };

        setVocabList([newItem, ...vocabList]);
        setNewWord('');
        setNewMeaning('');
        setNewExample('');
        alert('Đã thêm từ mới thành công!');
      };

      // Bulk Import Words
      const handleBulkImport = () => {
        if (!bulkText.trim()) return;

        const lines = bulkText.split('\n');
        const newItems = [];

        lines.forEach(line => {
          const parts = line.split('-').map(p => p.trim());
          if (parts[0] && parts[1]) {
            newItems.push({
              id: Math.random().toString(36).substr(2, 9),
              word: parts[0],
              meaning: parts[1],
              example: parts[2] || '',
              status: 'new',
              folder: targetFolderForAdd
            });
          }
        });

        if (newItems.length > 0) {
          setVocabList([...newItems, ...vocabList]);
          setBulkText('');
          alert(`Đã thêm thành công ${newItems.length} từ vựng vào mục "${targetFolderForAdd}"!`);
        } else {
          alert('Vui lòng kiểm tra lại định dạng: Từ - Nghĩa - Ví dụ');
        }
      };

      // Add New Folder
      const handleAddFolder = () => {
        if (!newFolderInput.trim()) return;
        if (!folders.includes(newFolderInput.trim())) {
          setFolders([...folders, newFolderInput.trim()]);
          setSelectedFolder(newFolderInput.trim());
          setTargetFolderForAdd(newFolderInput.trim());
        }
        setNewFolderInput('');
      };

      // Stats
      const masteredCount = filteredVocab.filter(i => i.status === 'mastered').length;
      const reviewCount = filteredVocab.filter(i => i.status === 'review').length;
      const percentMastered = filteredVocab.length ? Math.round((masteredCount / filteredVocab.length) * 100) : 0;

      return (
        <div className="max-w-6xl mx-auto px-4 py-6 flex flex-col min-h-screen">
          
          {/* HEADER */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-800">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-indigo-500/20">
                B2
              </div>
              <div>
                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                  VocabMaster <span className="text-xs px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400 font-bold border border-indigo-500/30">Pro B2</span>
                </h1>
                <p className="text-xs text-slate-400">Ôn tập từ vựng & Collocations thông minh</p>
              </div>
            </div>

            {/* FOLDER SELECTION BAR */}
            <div className="flex items-center gap-2 overflow-x-auto max-w-full pb-2 md:pb-0">
              <span className="text-xs font-semibold text-slate-400 whitespace-nowrap">Chủ đề:</span>
              {folders.map(f => (
                <button
                  key={f}
                  onClick={() => setSelectedFolder(f)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                    selectedFolder === f
                      ? 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md shadow-indigo-500/25'
                      : 'bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800'
                  }`}
                >
                  {f} {f !== 'Tất cả' && `(${vocabList.filter(i => i.folder === f).length})`}
                </button>
              ))}
            </div>
          </header>

          {/* MAIN NAV TABS */}
          <nav className="flex items-center justify-center my-6">
            <div className="bg-slate-900/90 backdrop-blur-md p-1.5 rounded-2xl border border-slate-800 flex gap-1 shadow-inner">
              <button
                onClick={() => setActiveTab('flashcard')}
                className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${
                  activeTab === 'flashcard'
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                }`}
              >
                <span>🎴</span> Flashcard
              </button>
              <button
                onClick={() => setActiveTab('games')}
                className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${
                  activeTab === 'games'
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                }`}
              >
                <span>🎮</span> Mini Game
              </button>
              <button
                onClick={() => setActiveTab('list')}
                className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${
                  activeTab === 'list'
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                }`}
              >
                <span>📚</span> Danh Sách ({filteredVocab.length})
              </button>
              <button
                onClick={() => setActiveTab('add')}
                className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${
                  activeTab === 'add'
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                }`}
              >
                <span>➕</span> Thêm Từ
              </button>
            </div>
          </nav>

          {/* TAB 1: FLASHCARD (BỰ & ÊM MẮT) */}
          {activeTab === 'flashcard' && (
            <div className="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full">
              
              {/* Progress & Controls Header */}
              <div className="w-full flex items-center justify-between mb-4 px-2">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full">
                    Mục: {selectedFolder} ({currentIndex + 1}/{filteredVocab.length || 1})
                  </span>
                  <span className="text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                    Thuộc: {masteredCount} ({percentMastered}%)
                  </span>
                </div>

                <button
                  onClick={() => setAnimMode(animMode === 'fade' ? 'flip' : 'fade')}
                  className="text-xs font-semibold text-slate-400 hover:text-white bg-slate-900 border border-slate-800 px-3 py-1 rounded-full transition-all"
                >
                  Chế độ chuyển thẻ: <strong className="text-indigo-400">{animMode === 'fade' ? 'Êm mắt (Fade)' : 'Xoay 3D (Flip)'}</strong>
                </button>
              </div>

              {filteredVocab.length === 0 ? (
                <div className="w-full h-80 bg-slate-900/50 border-2 border-dashed border-slate-800 rounded-3xl flex flex-col items-center justify-center text-center p-6">
                  <span className="text-5xl mb-4">📭</span>
                  <h3 className="text-xl font-bold text-white mb-2">Chưa có từ vựng nào trong thư mục này</h3>
                  <p className="text-slate-400 text-sm mb-4">Hãy thêm từ vựng mới hoặc chuyển sang thư mục khác để học.</p>
                  <button
                    onClick={() => setActiveTab('add')}
                    className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 transition-all"
                  >
                    + Thêm từ vựng mới ngay
                  </button>
                </div>
              ) : (
                <div className="w-full flex flex-col items-center">
                  
                  {/* FLASHCARD MAIN BOX (BỰ & RÕ) */}
                  <div 
                    onClick={() => setIsFlipped(!isFlipped)}
                    className={`w-full min-h-[460px] cursor-pointer relative select-none transition-all duration-300 ${
                      isFadingOut ? 'opacity-0 scale-95' : 'opacity-100 scale-100'
                    }`}
                  >
                    {/* FADE MODE (ÊM MẮT - MẶC ĐỊNH) */}
                    {animMode === 'fade' ? (
                      <div className="w-full h-full min-h-[460px] rounded-3xl p-8 md:p-12 flex flex-col items-center justify-between text-center border-2 border-indigo-500/30 bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950/40 shadow-2xl shadow-indigo-950/50 relative overflow-hidden group">
                        
                        {/* Background Decorative Glow */}
                        <div className="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl group-hover:bg-indigo-500/20 transition-all"></div>
                        <div className="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl group-hover:bg-purple-500/20 transition-all"></div>

                        {/* Top Indicator */}
                        <div className="w-full flex items-center justify-between text-slate-400 text-xs font-bold tracking-wider uppercase">
                          <span className="flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                            {isFlipped ? 'MẶT SAU: NGHĨA & VÍ DỤ' : 'MẶT TRƯỚC: TỪ VỰNG B2'}
                          </span>
                          <span className="text-indigo-400 bg-indigo-900/40 px-3 py-1 rounded-full border border-indigo-700/50">
                            Chạm để {isFlipped ? 'xem từ' : 'lật mặt sau'} 🔄
                          </span>
                        </div>

                        {/* Card Content */}
                        {!isFlipped ? (
                          /* MẶT TRƯỚC */
                          <div className="my-auto flex flex-col items-center py-6">
                            <h2 className="text-4xl md:text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200 mb-6 leading-tight">
                              {filteredVocab[currentIndex]?.word}
                            </h2>

                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                speak(filteredVocab[currentIndex]?.word);
                              }}
                              className="px-6 py-3 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 font-bold hover:bg-indigo-600 hover:text-white transition-all flex items-center gap-3 text-lg shadow-lg shadow-indigo-950/50"
                            >
                              <span>🔊</span> Phát âm chuẩn
                            </button>
                          </div>
                        ) : (
                          /* MẶT SAU */
                          <div className="my-auto flex flex-col items-center py-6">
                            <span className="text-xs font-bold text-amber-400 uppercase tracking-widest mb-2 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">
                              Giải nghĩa tiếng Việt
                            </span>
                            <h3 className="text-3xl md:text-5xl font-black text-amber-300 mb-6 leading-relaxed">
                              {filteredVocab[currentIndex]?.meaning}
                            </h3>

                            {filteredVocab[currentIndex]?.example && (
                              <div className="bg-slate-950/60 border border-slate-800 p-5 rounded-2xl max-w-xl text-slate-300 text-base md:text-lg italic leading-relaxed shadow-inner">
                                "{filteredVocab[currentIndex]?.example}"
                              </div>
                            )}
                          </div>
                        )}

                        {/* Bottom Tag */}
                        <div className="w-full flex items-center justify-between text-xs text-slate-400 font-semibold pt-4 border-t border-slate-800/80">
                          <span>Chủ đề: <strong className="text-slate-200">{filteredVocab[currentIndex]?.folder}</strong></span>
                          <span>Trạng thái: <strong className={filteredVocab[currentIndex]?.status === 'mastered' ? 'text-emerald-400' : 'text-amber-400'}>{filteredVocab[currentIndex]?.status === 'mastered' ? 'Đã thuộc ✨' : 'Chưa thuộc 🔄'}</strong></span>
                        </div>
                      </div>
                    ) : (
                      /* FLIP 3D MODE */
                      <div className="w-full h-full min-h-[460px] perspective-1000">
                        <div className={`relative w-full h-full min-h-[460px] transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                          
                          {/* Front Side */}
                          <div className="absolute inset-0 w-full h-full rounded-3xl p-8 md:p-12 flex flex-col items-center justify-between text-center border-2 border-indigo-500/30 bg-slate-900 backface-hidden shadow-2xl">
                            <div className="text-xs font-bold text-slate-400 uppercase">Mặt trước - Từ vựng</div>
                            <div className="my-auto">
                              <h2 className="text-4xl md:text-6xl font-black text-white mb-6">
                                {filteredVocab[currentIndex]?.word}
                              </h2>
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  speak(filteredVocab[currentIndex]?.word);
                                }}
                                className="px-5 py-2.5 rounded-xl bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 font-bold hover:bg-indigo-600 hover:text-white transition-all"
                              >
                                🔊 Nghe phát âm
                              </button>
                            </div>
                            <div className="text-xs text-indigo-400 font-bold">Bấm để xem mặt sau 🔄</div>
                          </div>

                          {/* Back Side */}
                          <div className="absolute inset-0 w-full h-full rounded-3xl p-8 md:p-12 flex flex-col items-center justify-between text-center border-2 border-purple-500/30 bg-slate-900 rotate-y-180 backface-hidden shadow-2xl">
                            <div className="text-xs font-bold text-purple-400 uppercase">Mặt sau - Nghĩa & Ví dụ</div>
                            <div className="my-auto">
                              <h3 className="text-3xl md:text-5xl font-black text-amber-300 mb-4">
                                {filteredVocab[currentIndex]?.meaning}
                              </h3>
                              {filteredVocab[currentIndex]?.example && (
                                <p className="text-slate-300 italic text-base md:text-lg bg-slate-950 p-4 rounded-xl border border-slate-800">
                                  "{filteredVocab[currentIndex]?.example}"
                                </p>
                              )}
                            </div>
                            <div className="text-xs text-purple-400 font-bold">Bấm để xoay lại 🔄</div>
                          </div>

                        </div>
                      </div>
                    )}
                  </div>

                  {/* ACTION BUTTONS (TỰ ĐỘNG CHUYỂN TỪ) */}
                  <div className="w-full flex items-center justify-between gap-4 mt-6">
                    <button
                      onClick={() => markStatusAndNext('review')}
                      className="flex-1 py-4 px-6 rounded-2xl bg-slate-900 border-2 border-amber-500/40 hover:border-amber-500 text-amber-400 font-black text-lg shadow-lg hover:bg-amber-500/10 active:scale-95 transition-all flex items-center justify-center gap-2"
                    >
                      <span>🔄</span> Cần ôn lại
                    </button>

                    <button
                      onClick={() => markStatusAndNext('mastered')}
                      className="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-black text-lg shadow-lg shadow-emerald-500/25 hover:from-emerald-400 hover:to-teal-500 active:scale-95 transition-all flex items-center justify-center gap-2"
                    >
                      <span>✨</span> Đã thuộc từ này
                    </button>
                  </div>

                  {/* NAV PREV / NEXT */}
                  <div className="flex items-center gap-6 mt-4">
                    <button
                      onClick={() => {
                        setIsFlipped(false);
                        setCurrentIndex(prev => (prev > 0 ? prev - 1 : filteredVocab.length - 1));
                      }}
                      className="px-4 py-2 rounded-xl bg-slate-900 text-slate-400 hover:text-white border border-slate-800 font-bold text-sm transition-all"
                    >
                      ⬅️ Từ trước
                    </button>
                    <span className="text-xs font-semibold text-slate-500">
                      Dùng phím mũi tên hoặc chạm để lật
                    </span>
                    <button
                      onClick={() => {
                        setIsFlipped(false);
                        setCurrentIndex(prev => (prev < filteredVocab.length - 1 ? prev + 1 : 0));
                      }}
                      className="px-4 py-2 rounded-xl bg-slate-900 text-slate-400 hover:text-white border border-slate-800 font-bold text-sm transition-all"
                    >
                      Từ tiếp ➡️
                    </button>
                  </div>

                </div>
              )}
            </div>
          )}

          {/* TAB 2: MINI GAME */}
          {activeTab === 'games' && (
            <div className="flex-1 max-w-3xl mx-auto w-full">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-xl">
                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    🎯 Ôn tập qua Game ({selectedFolder})
                  </h2>
                  <div className="flex items-center gap-4">
                    <span className="text-sm font-bold text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">
                      🔥 Chuỗi: {streak}
                    </span>
                    <span className="text-sm font-bold text-emerald-400 bg-emerald-400/10 px-3 py-1 rounded-full border border-emerald-400/20">
                      ⭐ Điểm: {score}
                    </span>
                  </div>
                </div>

                {filteredVocab.length < 4 ? (
                  <div className="text-center py-12 text-slate-400">
                    <p className="text-base mb-2">Cần ít nhất 4 từ vựng trong mục này để bắt đầu chơi game.</p>
                    <p className="text-xs text-slate-500">Hiện tại bạn có {filteredVocab.length} từ.</p>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {/* Simple Multiple Choice Game Placeholder */}
                    <div className="text-center py-8">
                      <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider">Từ vựng cần chọn nghĩa:</span>
                      <h3 className="text-4xl font-black text-white my-4">{filteredVocab[currentIndex]?.word}</h3>
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                        {filteredVocab.slice(0, 4).map((item, idx) => (
                          <button
                            key={idx}
                            onClick={() => {
                              if (item.id === filteredVocab[currentIndex]?.id) {
                                setScore(score + 10);
                                setStreak(streak + 1);
                                alert('🎉 Đúng rồi! +10 điểm');
                                setCurrentIndex((currentIndex + 1) % filteredVocab.length);
                              } else {
                                setStreak(0);
                                alert('❌ Chưa chính xác, thử lại nhé!');
                              }
                            }}
                            className="p-4 rounded-2xl bg-slate-950 border border-slate-800 hover:border-indigo-500 text-slate-200 font-bold text-left hover:bg-indigo-950/30 transition-all"
                          >
                            {String.fromCharCode(65 + idx)}. {item.meaning}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 3: DANH SÁCH TỪ VỰNG (LỌC CHUẨN THEO FOLDER) */}
          {activeTab === 'list' && (
            <div className="flex-1 max-w-4xl mx-auto w-full space-y-4">
              
              {/* Search & Filter Bar */}
              <div className="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <div className="relative w-full md:w-96">
                  <input
                    type="text"
                    placeholder="Tìm kiếm từ hoặc nghĩa..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                  {searchTerm && (
                    <button onClick={() => setSearchTerm('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-white">✕</button>
                  )}
                </div>

                <div className="text-xs font-semibold text-slate-400">
                  Hiển thị <strong className="text-indigo-400">{filteredVocab.length}</strong> từ thuộc danh mục <strong className="text-white">{selectedFolder}</strong>
                </div>
              </div>

              {/* Vocab List Items */}
              <div className="grid grid-cols-1 gap-3">
                {filteredVocab.map((item) => (
                  <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-5 flex items-start justify-between gap-4 hover:border-slate-700 transition-all group">
                    <div className="space-y-1">
                      <div className="flex items-center gap-3">
                        <h4 className="text-xl font-bold text-white group-hover:text-indigo-300 transition-colors">{item.word}</h4>
                        <button onClick={() => speak(item.word)} className="text-sm text-slate-400 hover:text-indigo-400">🔊</button>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 border border-slate-700">
                          {item.folder}
                        </span>
                      </div>
                      <p className="text-base font-medium text-amber-300">{item.meaning}</p>
                      {item.example && <p className="text-xs italic text-slate-400">"{item.example}"</p>}
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          setVocabList(vocabList.filter(i => i.id !== item.id));
                        }}
                        className="text-slate-500 hover:text-rose-400 p-2 rounded-lg hover:bg-slate-800 transition-all text-xs"
                      >
                        🗑️ Xóa
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 4: THÊM TỪ VỰNG (THỦ CÔNG + HÀNG LOẠT) */}
          {activeTab === 'add' && (
            <div className="flex-1 max-w-3xl mx-auto w-full space-y-6">
              
              {/* TARGET FOLDER SELECTOR */}
              <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 className="text-base font-bold text-white flex items-center gap-2">
                  📁 Chọn thư mục lưu từ mới
                </h3>
                <div className="flex flex-wrap items-center gap-2">
                  {folders.filter(f => f !== 'Tất cả').map(f => (
                    <button
                      key={f}
                      type="button"
                      onClick={() => setTargetFolderForAdd(f)}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                        targetFolderForAdd === f
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                          : 'bg-slate-950 text-slate-400 border border-slate-800 hover:text-white'
                      }`}
                    >
                      {f}
                    </button>
                  ))}
                </div>

                {/* Create New Folder */}
                <div className="flex items-center gap-2 pt-2">
                  <input
                    type="text"
                    placeholder="Tên thư mục mới..."
                    value={newFolderInput}
                    onChange={(e) => setNewFolderInput(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                  />
                  <button
                    onClick={handleAddFolder}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition-all"
                  >
                    + Tạo thư mục
                  </button>
                </div>
              </div>

              {/* SINGLE ADD FORM */}
              <form onSubmit={handleAddWord} className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 className="text-base font-bold text-white">✍️ Thêm 1 từ thủ công</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Từ / Cụm từ tiếng Anh *</label>
                    <input
                      type="text"
                      required
                      placeholder="v.d: climb the corporate ladder"
                      value={newWord}
                      onChange={(e) => setNewWord(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Nghĩa tiếng Việt *</label>
                    <input
                      type="text"
                      required
                      placeholder="v.d: thăng tiến trong công việc"
                      value={newMeaning}
                      onChange={(e) => setNewMeaning(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Ví dụ đặt câu (Không bắt buộc)</label>
                  <input
                    type="text"
                    placeholder="v.d: He worked hard to climb the corporate ladder."
                    value={newExample}
                    onChange={(e) => setNewExample(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition-all"
                >
                  + Thêm từ này vào mục "{targetFolderForAdd}"
                </button>
              </form>

              {/* BULK IMPORT FORM */}
              <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">📋 Dán hàng loạt nhiều từ (Bulk Add)</h3>
                  <span className="text-xs text-indigo-400 font-semibold">Định dạng: Từ - Nghĩa - Ví dụ</span>
                </div>
                <textarea
                  rows="5"
                  placeholder={`climb the corporate ladder - thăng tiến công việc - He worked hard.\nwork-life balance - cân bằng cuộc sống - Maintaining balance is crucial.\npursue a career - theo đuổi sự nghiệp - She wants to pursue finance.`}
                  value={bulkText}
                  onChange={(e) => setBulkText(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-white focus:outline-none focus:border-indigo-500 font-mono leading-relaxed"
                ></textarea>
                <button
                  onClick={handleBulkImport}
                  className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-sm shadow-lg shadow-emerald-600/25 transition-all"
                >
                  ⚡ Nhập tất cả danh sách trên vào mục "{targetFolderForAdd}"
                </button>
              </div>

            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto pt-8 pb-4 text-center text-xs text-slate-500 border-t border-slate-800/60">
            VocabMaster B2 App • Thiết kế cho việc học từ vựng hiệu quả
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
